<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aquarium</title>
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  /* the tank only -- this must not reach the preview canvas in the modal */
  #c{display:block;width:100%;height:100%;touch-action:none}
  /* the pair of floating buttons, and the panel the gear opens above them */
  #fabs{
    position:fixed;right:18px;z-index:3;
    bottom:calc(18px + env(safe-area-inset-bottom));
    display:flex;gap:10px;align-items:center
  }
  .fab{
    width:46px;height:46px;padding:0;
    background:rgba(255,255,255,.9);backdrop-filter:blur(6px);
    border:1px solid #e2e2e2;border-radius:50%;
    box-shadow:0 4px 14px rgba(0,0,0,.12);
    display:grid;place-items:center;cursor:pointer;
    transition:transform .25s ease,background .2s ease
  }
  .fab:hover{background:#fff}
  .fab svg{display:block}
  #fab.open{transform:rotate(45deg)}

  #panel{
    position:fixed;right:18px;z-index:2;
    bottom:calc(76px + env(safe-area-inset-bottom));
    font:12px/1.5 ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif;
    color:#8b8f94;background:rgba(255,255,255,.86);backdrop-filter:blur(6px);
    border:1px solid #ececec;border-radius:10px;padding:12px 14px;
    display:grid;grid-template-columns:auto 108px 34px;gap:7px 10px;align-items:center;
    transition:opacity .22s ease,transform .22s ease;user-select:none;
    opacity:0;transform:translateY(8px) scale(.98);pointer-events:none
  }
  #panel.open{opacity:1;transform:none;pointer-events:auto}
  #panel label{white-space:nowrap}
  #panel input{width:108px;accent-color:#111}
  #panel b{font-weight:500;color:#111;text-align:right;font-variant-numeric:tabular-nums}
  #panel select{
    grid-column:2/-1;width:100%;font:inherit;color:#111;background:#fff;
    border:1px solid #ddd;border-radius:6px;padding:3px 5px
  }
  /* close row at the foot of the menu */
  #closePanel{
    grid-column:1/-1;width:100%;margin-top:4px;
    font:inherit;color:#6b7075;background:#fff;
    border:1px solid #e4e4e4;border-radius:7px;padding:5px 0;cursor:pointer
  }
  #closePanel:hover{background:#f4f4f4;color:#111}
  #hint{grid-column:1/-1;color:#b7bbc0;font-size:11px;padding-top:2px}
  /* no keyboard on a phone, so the shortcut hint is desktop only */
  @media (max-width:760px){ #hint{display:none} }


  /* modal */
  #veil{
    position:fixed;inset:0;z-index:10;display:none;
    align-items:center;justify-content:center;
    background:rgba(20,24,28,.42);backdrop-filter:blur(3px)
  }
  #veil.on{display:flex}
  #modal{
    position:relative;
    width:min(50vw,620px);min-width:340px;max-height:88vh;overflow:auto;
    background:#fff;border-radius:14px;padding:20px;
    font:14px/1.5 ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif;color:#1b1f23;
    box-shadow:0 24px 60px rgba(0,0,0,.28)
  }
  @media (max-width:760px){
    /* fill the screen from the top rather than centring, and use dvh so the
       phone's own toolbars don't push the header off the top */
    #veil{align-items:stretch;justify-content:stretch}
    #modal{
      width:100vw;min-width:0;border-radius:0;
      height:100vh;height:100dvh;max-height:none;
      padding:calc(20px + env(safe-area-inset-top)) 20px
              calc(20px + env(safe-area-inset-bottom));
    }
    #x{top:calc(14px + env(safe-area-inset-top))}
  }
  #modal h2{margin:0 0 4px;font-size:15px;font-weight:600}
  #modal p{margin:0 0 14px;color:#6b7076;font-size:13px}

  /* every step uses the same media height, so switching between them
     doesn't resize the modal underneath the pointer */
  .media{position:relative;height:clamp(240px,46vh,420px)}

  /* the live camera, with a framing rectangle at 80% of the picture */
  #stage{
    position:relative;background:#111;border-radius:10px;overflow:hidden;
    display:grid;place-items:center
  }
  /* sized to the camera's own shape, so the guide lines up with what will
     actually be cropped out of the video */
  #camwrap{position:relative;width:100%;height:100%}
  /* mirrored, so moving the drawing left moves it left on screen. The photo
     is mirrored to match, so what you framed is what you get. */
  #cam{display:block;width:100%;height:100%;object-fit:fill;transform:scaleX(-1)}
  /* the bracket: everything inside it is what gets processed. --gi is set
     from the same constant the crop uses, so they can't drift apart.
     The outline is the second frame, sitting 8px outside the first. */
  #guide{
    position:absolute;inset:var(--gi,17%);
    border:2px solid #fff;border-radius:4px;pointer-events:none;
    outline:2px solid #fff;outline-offset:8px;
    box-shadow:0 0 0 100vmax rgba(0,0,0,.28)
  }
  #preview{position:absolute;inset:0;display:block;width:100%;height:100%;
           background:#fff;border-radius:10px}

  .row{display:flex;gap:10px;align-items:center;margin-top:14px}
  .row.end{justify-content:flex-end}
  button.act{
    font:inherit;padding:9px 16px;border-radius:8px;cursor:pointer;
    border:1px solid #000;background:#fff;color:#000
  }
  button.act.primary{background:#111;color:#fff}
  button.act:disabled{opacity:.4;cursor:default}
  #busy{display:grid;place-items:center;gap:12px;color:#6b7076}
  .spin{
    width:26px;height:26px;border:2px solid #e3e5e7;border-top-color:#111;
    border-radius:50%;animation:spin .8s linear infinite
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  /* sits over the camera area, so showing it never resizes the modal */
  #err{
    position:absolute;inset:0;z-index:2;display:grid;place-items:center;
    padding:24px;text-align:center;color:#fff;font-size:13px;
    background:rgba(10,12,14,.62)
  }
  /* stands in for the camera on a phone, where we go straight to upload */
  #noCam{
    position:absolute;inset:0;z-index:2;display:grid;place-items:center;
    padding:24px;text-align:center;color:#8b9099;font-size:13px;line-height:1.6;
    background:#fff;border-radius:10px;border:2px dashed #cfd4da
  }
  #noCam svg{display:block;margin:0 auto 14px;color:#cfd4da}

  /* which way round the fish should end up */
  .edge{
    position:absolute;top:50%;z-index:2;pointer-events:none;
    font-size:10px;font-weight:600;letter-spacing:.14em;color:#b0b6bd
  }
  .edge.front{right:2px;transform:translateY(-50%) rotate(90deg)}
  .edge.back {left:2px; transform:translateY(-50%) rotate(90deg)}
  /* close button, top right of the modal */
  #x{
    position:absolute;top:14px;right:14px;z-index:3;
    width:30px;height:30px;padding:0;
    background:#fff;border:1px solid #000;border-radius:8px;
    display:grid;place-items:center;cursor:pointer
  }
  #x:hover{background:#f4f4f4}
  .hide{display:none !important}
</style>
<!-- Vercel Web Analytics: this is what @vercel/analytics' inject() loads. Only
     reports when the page is served from a Vercel deployment. -->
<script defer src="/_vercel/insights/script.js"></script>

<script type="x-shader/x-vertex" id="vs">#version 300 es
precision highp float;
in vec2 a_uv;                 // u: 0 tail -> 1 head, v: 0 top -> 1 bottom
uniform mat4 u_vp;
uniform vec3 u_pos;           // world position of the fish centre
uniform vec2 u_half;          // half width, half height of the drawing
uniform float u_flip;         // -1 mirrors the drawing, so it can swim back the other way
uniform float u_ang;          // the tilt it is swimming at, mirroring included
uniform float u_bodyHalf;     // half the body length, along that tilt
uniform float u_heading;      // steering yaw, measured off the drawn tilt
uniform float u_roll;         // slight bank so fish aren't all dead level
uniform float u_phase;
uniform float u_amp;          // wave amplitude, fraction of body length
uniform float u_freq;         // wavelengths along the body
uniform float u_beat;         // tail beat phase (already time-scaled)
out vec2 v_uv;

void main(){
  float u = a_uv.x, v = a_uv.y;
  // mirroring the geometry but not the texture coords flips the drawing
  vec2 q = vec2((u - 0.5) * 2.0 * u_half.x * u_flip, (0.5 - v) * 2.0 * u_half.y);

  // step into the fish's own frame, so the wave runs nose-to-tail along the
  // axis it was actually drawn on rather than straight across the picture
  float ca = cos(u_ang), sa = sin(u_ang);
  vec3 p = vec3(q.x * ca + q.y * sa, -q.x * sa + q.y * ca, 0.0);

  // travelling wave: nothing at the nose, most of the sway at the tail
  float head = clamp(p.x / u_bodyHalf, -1.0, 1.0) * 0.5 + 0.5;
  float tail = pow(1.0 - head, 1.6);
  float ph   = u_beat + u_phase - u_freq * head;
  p.z += u_amp * u_bodyHalf * tail * sin(ph);
  // the head yaws a little against the tail, the way a real fish does
  p.z += u_amp * u_bodyHalf * 0.12 * head * sin(ph + 2.2);

  // bank around the swimming axis
  float cr = cos(u_roll), sr = sin(u_roll);
  p.yz = vec2(p.y * cr - p.z * sr, p.y * sr + p.z * cr);

  // yaw: this is what swings the fish through depth
  float ch = cos(u_heading), sh = sin(u_heading);
  p.xz = vec2(p.x * ch + p.z * sh, -p.x * sh + p.z * ch);

  // and back out, so the drawing keeps the tilt it was made with
  vec3 w = vec3(p.x * ca - p.y * sa, p.x * sa + p.y * ca, p.z);

  v_uv = a_uv;
  gl_Position = u_vp * vec4(w + u_pos, 1.0);
}
</script>

<script type="x-shader/x-fragment" id="fs">#version 300 es
precision mediump float;
in vec2 v_uv;
uniform sampler2D u_tex;
uniform float u_fade;         // fade in/out as fish enter and leave
uniform vec3 u_body;          // colour for the paper-white inside
uniform vec3 u_ink;           // colour for the drawn lines
uniform float u_tint;         // 1 = take the theme's colours, 0 = keep your own
out vec4 outColor;
void main(){
  vec4 t = texture(u_tex, v_uv);          // premultiplied
  if (t.a < 0.003) discard;
  float g = clamp(t.r / t.a, 0.0, 1.0);   // 1 = paper, 0 = ink
  vec3 c = mix(t.rgb / t.a, mix(u_ink, u_body, g), u_tint);
  outColor = vec4(c * t.a, t.a) * u_fade;
}
</script>

<script>
(() => {
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {alpha:false, antialias:true, premultipliedAlpha:true});
if (!gl) { document.body.innerHTML = '<p style="font:14px sans-serif;padding:2rem">This needs WebGL 2.</p>'; return; }

/* ---------- settings the panel drives ---------- */
const cfg = { count: 8, speed: 1, wave: 1, turn: 0.5, theme: 'paper' };

/* ---------- themes ---------- */
const hex = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
const mixc = (a, b, k) => a.map((v,i) => v + (b[i] - v) * k);

// each fish is drawn as paper-white with ink lines, so a theme just says what
// colour the paper and the lines become
function skin(bodyHex, inkHex){ return { body: hex(bodyHex), ink: hex(inkHex) }; }
const DEEP = hex('#0e3346');
function tinted(bodyHex){
  const body = hex(bodyHex);
  return { body, ink: mixc(body, DEEP, 0.78) };   // lines = a deep version of the body
}

const THEMES = {
  paper: {
    bg: hex('#ffffff'),
    skins: [ skin('#ffffff', '#000000') ]
  },
  water: {
    bg: hex('#1f6c92'),
    skins: [
      // blues
      tinted('#cfeaf7'), tinted('#8ccbec'), tinted('#5aa6d8'), tinted('#a9dcf2'),
      // purples
      tinted('#cabff5'), tinted('#a48ee9'), tinted('#8570da'), tinted('#ded4fa'),
      // oranges
      tinted('#ffb877'), tinted('#ff9450'), tinted('#ffd3a3'), tinted('#f4763d')
    ]
  }
};
const theme = () => THEMES[cfg.theme] || THEMES.paper;

/* ---------- camera ---------- */
const CAM_Z = 12, FOV = 42 * Math.PI/180;
const NEAR_Z = 3.0, FAR_Z = -7.0;      // depth band the fish live in
let aspect = 1, vp = new Float32Array(16);

function makeVP(a){
  // perspective, with the camera pull-back (a translate along Z) folded in
  const f = 1/Math.tan(FOV/2), near = 0.1, far = 60;
  const A = (far + near)/(near - far), B = (2*far*near)/(near - far);
  return new Float32Array([
    f/a, 0, 0,  0,
    0,   f, 0,  0,
    0,   0, A, -1,
    0,   0, B - A*CAM_Z, CAM_Z
  ]);
}
const buildVP = () => { vp = makeVP(aspect); };
// visible half-height / half-width at a given depth
const halfHAt = z => Math.tan(FOV/2) * (CAM_Z - z);
const halfWAt = z => halfHAt(z) * aspect;

/* ---------- mesh ---------- */
const NX = 40, NY = 6;
function makeMesh(gl){
  const uv = [], idx = [];
  for (let j=0;j<=NY;j++) for (let i=0;i<=NX;i++) uv.push(i/NX, j/NY);
  for (let j=0;j<NY;j++) for (let i=0;i<NX;i++){
    const a=j*(NX+1)+i, b=a+1, c=a+NX+1, d=c+1;
    idx.push(a,c,b, b,c,d);
  }
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(uv), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return { vao, n: idx.length };
}

/* ---------- program ---------- */
// built per context: the tank and the modal preview are separate canvases,
// and a WebGL program can't be shared across them
function buildCtx(gl){
  const compile = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src.trim()); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.bindAttribLocation(prog, 0, 'a_uv');
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  const U = {};
  for (const k of ['u_vp','u_pos','u_half','u_flip','u_ang','u_bodyHalf','u_heading','u_roll',
                   'u_phase','u_amp','u_freq','u_beat','u_tex','u_fade','u_body','u_ink','u_tint'])
    U[k] = gl.getUniformLocation(prog, k);
  return { gl, prog, U, mesh: makeMesh(gl) };
}

function makeTexture(gl, source){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}

// draw one fish with the given skin; shared by the tank and the preview
function drawOne(ctx, f, sk){
  const { gl, U } = ctx;
  gl.bindTexture(gl.TEXTURE_2D, f.tex || f.sp.tex);
  gl.uniform3fv(U.u_body, sk.body);
  gl.uniform3fv(U.u_ink, sk.ink);
  gl.uniform1f(U.u_tint, f.sp.tint);
  gl.uniform3f(U.u_pos, f.x, f.y, f.z);
  gl.uniform2f(U.u_half, f.sp.hw, f.sp.hh);
  gl.uniform1f(U.u_flip, f.flip);
  gl.uniform1f(U.u_ang, f.ang);
  gl.uniform1f(U.u_bodyHalf, f.sp.bodyHalf);
  gl.uniform1f(U.u_heading, f.heading);
  gl.uniform1f(U.u_roll, f.roll);
  gl.uniform1f(U.u_phase, f.phase);
  gl.uniform1f(U.u_amp, f.amp * cfg.wave * 0.7);
  gl.uniform1f(U.u_freq, f.freq);
  gl.uniform1f(U.u_beat, f.beat);
  gl.uniform1f(U.u_fade, Math.max(0, Math.min(1, f.fade)));
  gl.drawElements(gl.TRIANGLES, ctx.mesh.n, gl.UNSIGNED_SHORT, 0);
}

const ctx = buildCtx(gl);
const U = ctx.U, prog = ctx.prog;

/* ---------- species (one per drawing) ---------- */
// world units per scanned pixel: a 700px-wide drawing comes out 3.6 units long
const SCALE = 3.6 / 700;
const species = [];

// tint 1 = follows the theme's colours, 0 = keeps the colours it came with
function makeSpecies(tex, w, h, ang, tint){
  const hw = w/2, hh = h/2;
  return {
    tex, hw, hh, ang, tint,
    // how far the body reaches along its own axis
    bodyHalf: Math.abs(hw * Math.cos(ang)) + Math.abs(hh * Math.sin(ang)),
    reach: Math.hypot(hw, hh)                   // margin for entering/leaving
  };
}
async function loadSpecies(){
  let list;
  try {
    list = await (await fetch('assets/fish/manifest.json')).json();
  } catch (e) {
    throw new Error('Could not read assets/fish/manifest.json. Open this page '
      + 'through a local web server, not by double-clicking the file.');
  }
  await Promise.all(list.map(rec => new Promise(res => {
    const img = new Image();
    img.onload = () => {
      // straight scale from the drawing, so a fish sketched twice as big
      // really is twice as big here
      const ang = -rec.angle * Math.PI/180;      // scans count Y downwards
      species.push(makeSpecies(makeTexture(gl, img), SCALE * rec.w, SCALE * rec.h, ang, 1));
      res();
    };
    img.onerror = () => res();
    img.src = 'assets/fish/' + rec.file;
  })));
}

/* ---------- fish ---------- */
const rnd = (a,b) => a + Math.random()*(b-a);
const fish = [];
let custom = null;        // the one photographed fish, replaced by each capture

// which way the fish is actually travelling: its drawn tilt, plus how far it
// has currently steered off it
function dirOf(f){
  const ca = Math.cos(f.ang), sa = Math.sin(f.ang);
  const ch = Math.cos(f.heading), sh = Math.sin(f.heading);
  return [ch * ca, ch * sa, -sh];
}

function spawn(f, firstFrame){
  const inUse = new Set(fish.filter(x => x !== f && x.sp).map(x => x.sp));
  let sp, guard = 0;
  // the fish someone photographed is always one of the ones on screen
  if (custom && !inUse.has(custom)) sp = custom;
  else do { sp = species[(Math.random()*species.length)|0]; } while (inUse.has(sp) && ++guard < 40);

  f.sp = sp;
  f.z = rnd(FAR_Z, NEAR_Z);
  f.heading = 0;                                   // steering, off the drawn tilt
  // half of them swim back the other way. The drawing is mirrored to match,
  // so a fish is never seen swimming tail-first. A captured fish carries a
  // fixed mirror of its own (baseFlip) when it was held up facing left.
  const rf = Math.random() < 0.5 ? -1 : 1;
  f.flip = rf * (sp.baseFlip || 1);
  f.ang = rf < 0 ? Math.PI - sp.ang : sp.ang;

  const m = sp.reach, hw = halfWAt(f.z) + m, hh = halfHAt(f.z) + m;
  if (firstFrame){
    f.x = rnd(-1,1) * (hw - m);                    // start mid-tank, not all
    f.y = rnd(-1,1) * (hh - m);                    // arriving at once
  } else {
    // back the fish up along its own heading until it is just off-screen,
    // then slide it sideways so they don't all file through one point
    const d = dirOf(f);
    const t = Math.min(
      Math.abs(d[0]) > 1e-4 ? hw/Math.abs(d[0]) : Infinity,
      Math.abs(d[1]) > 1e-4 ? hh/Math.abs(d[1]) : Infinity);
    const lat = rnd(-0.7, 0.7) * Math.min(hw, hh);
    f.x = -d[0]*t - d[1]*lat;
    f.y = -d[1]*t + d[0]*lat;
  }

  f.ang0   = f.ang;      // the direction it settled on; steering works off this
  f.steer  = 0;          // how far it has currently turned off that
  f.steerTarget = 0;
  f.startle = 0;         // 1 right after a fright, fading to 0
  f.startleDur = 1.1;    // seconds it takes to calm down
  f.burst = 1.1;         // how much faster it swims at full fright
  f.skin   = (Math.random() * 64) | 0;   // wraps onto whichever palette is live
  f.spd    = rnd(0.45, 1.15);
  f.roll   = rnd(-0.22, 0.22);
  f.phase  = rnd(0, Math.PI*2);
  f.amp    = rnd(0.10, 0.20);
  f.freq   = rnd(2.6, 4.2);
  f.beat   = rnd(0, Math.PI*2);
  f.bobA   = rnd(0.04, 0.16);
  f.bobW   = rnd(0.25, 0.7);
  f.wanderW= rnd(0.10, 0.32);
  f.wanderP= rnd(0, Math.PI*2);
  f.driftW = rnd(0.05, 0.18);
  f.driftP = rnd(0, Math.PI*2);
  f.life   = 0;
}

/* ---------- the pointer: fish shy away from it, and can be dragged ---------- */
const pointer = { x: 0, y: 0, inside: false };
let dragging = null;

const MAX_STEER = 80 * Math.PI/180;   // never enough to roll a fish belly-up
const wrapPi = a => Math.atan2(Math.sin(a), Math.cos(a));

// where the pointer is in world units, at a given depth
function pointerAt(z){
  const r = canvas.getBoundingClientRect();
  return [ ((pointer.x - r.left)/r.width  * 2 - 1) * halfWAt(z),
           (1 - (pointer.y - r.top)/r.height * 2) * halfHAt(z) ];
}

// To turn back on itself a fish mirrors, the way it does when it spawns --
// rotating it that far would show it belly-up instead.
//
// Mirroring is deliberately reluctant. It only happens when the fish is
// decisively heading the other way, and only after it has stayed that way
// for a moment: a fish briefly swimming slightly backwards looks far better
// than one flickering between the two directions, which is what a wobbling
// finger on a touchscreen would otherwise cause.
const REFACE_COS = 0.35;      // how opposed the two directions must be
const REFACE_HOLD = 0.18;     // seconds it must stay that way

function reface(f, ang, dt){
  if (Math.cos(ang) * Math.cos(f.ang0) < -REFACE_COS) f.wrongWay = (f.wrongWay || 0) + dt;
  else f.wrongWay = 0;
  if (f.wrongWay > REFACE_HOLD){
    f.flip = -f.flip;
    f.ang0 = wrapPi(Math.PI - f.ang0);
    f.wrongWay = 0;
  }
}

function steerTowards(f, ang, dt){
  reface(f, ang, dt);
  f.steerTarget = Math.max(-MAX_STEER, Math.min(MAX_STEER, wrapPi(ang - f.ang0)));
}

// whichever fish is under the pointer, nearest to the camera first
function pickFish(){
  let best = null;
  for (const f of fish){
    const [mx, my] = pointerAt(f.z);
    const hw = f.sp.hw * 1.05;
    const hh = Math.max(f.sp.hh, f.sp.hw * 0.3) * 1.2;
    if (Math.abs(mx - f.x) <= hw && Math.abs(my - f.y) <= hh)
      if (!best || f.z > best.z) best = f;
  }
  return best;
}

// held by the pointer: it trails the cursor, thrashes its tail, and points
// the way it is being pulled
const GRAB = 0.65;      // how far up the body the pointer holds it, 1 = the nose

function dragUpdate(f, dt){
  const [mx, my] = pointerAt(f.z);

  // Steer by how the pointer is moving, not by how the fish is moving. The
  // head offset below shifts the fish every time it turns, so steering off
  // its own velocity feeds back on itself and the fish shudders in place.
  if (f.pmx !== undefined){
    // smoothed: single-frame deltas are far too jittery, especially on touch
    const k = Math.min(1, dt * 7);
    f.pvx += ((mx - f.pmx) / Math.max(dt, 1e-3) - f.pvx) * k;
    f.pvy += ((my - f.pmy) / Math.max(dt, 1e-3) - f.pvy) * k;
    if (Math.hypot(f.pvx, f.pvy) > 0.8) steerTowards(f, Math.atan2(f.pvy, f.pvx), dt);
  } else {
    f.pvx = 0; f.pvy = 0;
  }
  f.pmx = mx; f.pmy = my;

  // held near the head rather than the middle, so the body trails behind
  const reach = GRAB * f.sp.bodyHalf;
  const tx = mx - Math.cos(f.ang) * reach;
  const ty = my - Math.sin(f.ang) * reach;
  const step = Math.min(1, dt * 14);
  f.x += (tx - f.x) * step;
  f.y += (ty - f.y) * step;
  f.steer += (f.steerTarget - f.steer) * Math.min(1, dt * 8);
  f.ang = f.ang0 + f.steer;
  f.beat += dt * 26;      // beating hard against being held
  f.fade = 1;
}

canvas.addEventListener('pointermove', e => {
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = true;
});
canvas.addEventListener('pointerleave', () => { pointer.inside = false; });
canvas.addEventListener('pointerdown', e => {
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = true;
  const f = pickFish();
  if (!f) return;
  dragging = f;
  f.pmx = undefined; f.wrongWay = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  canvas.style.cursor = 'grabbing';
});
addEventListener('pointerup', () => {
  if (!dragging) return;
  // let go and it bolts away from the pointer for a couple of seconds
  dragging.startle = 1;
  dragging.startleDur = 2;
  dragging.burst = 2.6;
  dragging.fleeNow = true;
  dragging = null;
  canvas.style.cursor = '';
});

function update(f, t, dt){
  if (f === dragging) return dragUpdate(f, dt);
  f.life += dt;

  // frightened by the pointer: turn away from it and put on a burst
  if (pointer.inside){
    const [mx, my] = pointerAt(f.z);
    const dx = f.x - mx, dy = f.y - my;
    const d = Math.hypot(dx, dy);
    if (d < f.sp.reach + 1.4 && d > 1e-4){
      f.startle = 1; f.startleDur = 1.1; f.burst = 1.1;
      steerTowards(f, Math.atan2(dy, dx), dt);
    }
  }
  // just let go: commit to an escape course straight away. dt is passed as a
  // whole second so the mirroring hysteresis decides now rather than dithering.
  if (f.fleeNow){
    const [mx, my] = pointerAt(f.z);
    steerTowards(f, Math.atan2(f.y - my, f.x - mx), 1);
    f.fleeNow = false;
  }
  if (f.startle > 0){
    f.startle = Math.max(0, f.startle - dt / f.startleDur);
    if (f.startle === 0) f.steerTarget = 0;      // settle back on course
  }
  f.steer += (f.steerTarget - f.steer) * Math.min(1, dt * 6);
  f.ang = f.ang0 + f.steer;
  // steer: a slow wander swings the fish through depth so it turns towards
  // and away from the viewer instead of sliding flat across
  f.heading = cfg.turn * Math.sin(t * f.wanderW + f.wanderP);

  const d = dirOf(f);
  const v = f.spd * cfg.speed * (1 + f.burst * f.startle);
  f.x += d[0] * v * dt;
  f.y += d[1] * v * dt;
  f.z += d[2] * v * dt;
  f.z += Math.sin(t * f.driftW + f.driftP) * 0.25 * dt;

  // a gentle bob across the line it is swimming on
  const bob = Math.cos(t * f.bobW + f.phase) * f.bobA * dt * 4.0;
  f.x += -d[1] * bob;
  f.y +=  d[0] * bob;

  // keep them inside the depth band
  if (f.z > NEAR_Z) f.z = NEAR_Z; if (f.z < FAR_Z) f.z = FAR_Z;

  // tail beats faster when swimming faster
  f.beat += dt * (2.2 + v * 2.6) * (0.6 + cfg.wave * 0.6) * (1 + 1.6 * f.startle);

  // fish leave by whichever edge they are pointing at, not just left and right
  const m = f.sp.reach, hw = halfWAt(f.z) + m, hh = halfHAt(f.z) + m;
  f.fade = Math.max(0, Math.min(1, Math.min(hw - Math.abs(f.x), hh - Math.abs(f.y)) / m));
  const gone = Math.abs(f.x) > hw || Math.abs(f.y) > hh;
  if (gone && f.x * d[0] + f.y * d[1] > 0) spawn(f, false);
}

/* ---------- render ---------- */
let seeded = false, t0 = performance.now()/1000, last = t0;

function frame(now){
  now /= 1000;
  const dt = Math.min(0.05, now - last); last = now;
  const t = now - t0;
  resize();          // no-op unless the canvas size actually changed

  // Grow or shrink the shoal to match the slider. Only the very first fill
  // starts mid-tank; anything added later swims in from off-screen.
  while (fish.length < cfg.count) { const f = {}; spawn(f, !seeded); fish.push(f); }
  seeded = true;
  while (fish.length > cfg.count){
    // drop whichever is least visible, so nothing blinks out mid-screen
    let worst = -1;
    for (let i = 0; i < fish.length; i++){
      if (fish[i] === dragging) continue;
      if (worst < 0 || (fish[i].fade ?? 1) < (fish[worst].fade ?? 1)) worst = i;
    }
    if (worst < 0) break;
    fish.splice(worst, 1);
  }

  for (const f of fish) update(f, t, dt);
  fish.sort((a,b) => a.z - b.z);            // far to near, so near fish cover far ones

  const th = theme();
  gl.clearColor(th.bg[0], th.bg[1], th.bg[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.disable(gl.DEPTH_TEST);

  gl.useProgram(prog);
  gl.bindVertexArray(ctx.mesh.vao);
  gl.uniformMatrix4fv(U.u_vp, false, vp);
  gl.uniform1i(U.u_tex, 0);
  gl.activeTexture(gl.TEXTURE0);

  if (!dragging) canvas.style.cursor = (pointer.inside && pickFish()) ? 'grab' : '';

  for (const f of fish) drawOne(ctx, f, th.skins[f.skin % th.skins.length]);
  requestAnimationFrame(frame);
}

/* ---------- plumbing ---------- */
function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  aspect = w/h; gl.viewport(0,0,w,h); buildVP();
}
addEventListener('resize', resize);

// the options live behind the gear button, so they stay out of the way of the fish
const panel = document.getElementById('panel');
const fab = document.getElementById('fab');
const fabs = document.getElementById('fabs');
function setPanel(open){
  panel.classList.toggle('open', open);
  fab.classList.toggle('open', open);
  fab.setAttribute('aria-expanded', open ? 'true' : 'false');
}
const panelOpen = () => panel.classList.contains('open');
fab.addEventListener('click', () => setPanel(!panelOpen()));
document.getElementById('closePanel').addEventListener('click', () => setPanel(false));
// tapping the water dismisses the menu on a phone, where there's no room to spare
addEventListener('pointerdown', e => {
  if (!isMobile() || !panelOpen() || veil.classList.contains('on')) return;
  if (panel.contains(e.target) || fabs.contains(e.target)) return;
  setPanel(false);
}, true);
addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H') setPanel(!panelOpen());
  if (e.key === 'Escape' && panelOpen() && !veil.classList.contains('on')) setPanel(false);
});
for (const [id, key, dp] of [['count','count',0],['speed','speed',1],['wave','wave',1],['turn','turn',1]]){
  const el = document.getElementById(id), out = document.getElementById(id+'V');
  const sync = () => { cfg[key] = +el.value; out.textContent = (+el.value).toFixed(dp); };
  el.addEventListener('input', sync);
  sync();
}

const themeSel = document.getElementById('theme');
function applyTheme(){
  cfg.theme = themeSel.value;
  const bg = theme().bg;
  // keep the page behind the canvas in step, so no white edge flashes
  document.body.style.background =
    `rgb(${bg.map(v => Math.round(v*255)).join(',')})`;
}
themeSel.addEventListener('change', applyTheme);
applyTheme();

/* ---------- add your own fish ---------- */
const el = id => document.getElementById(id);
const veil = el('veil'), cam = el('cam'), errBox = el('err');
const steps = { camera: el('step-cam'), busy: el('step-busy'), done: el('step-done') };

const CUSTOM_LEN = 2.8;        // captured fish are sized to this, not to the photo
// How much of the picture sits inside the bracket. One constant drives both
// the frame you see and the crop that gets processed, so they always agree.
const FRAME = 0.66;
// phones go straight to upload: the file picker there offers the camera
// anyway, and a live feed in a modal is awkward one-handed
const isMobile = () => matchMedia('(max-width: 760px)').matches;
let stream = null;             // live webcam, while the modal is open
let shot = null;               // the cut-out, as a canvas
let shot0 = null;              // the cut-out as captured
let shotTurns = 0;             // quarter turns clockwise applied to it
let pv = null;                 // preview: its own GL context and fish
let pvRaf = 0;

// fit the camera box to the camera's own shape, inside the media box.
// Done here rather than with CSS aspect-ratio, which was overflowing the
// stage and getting clipped.
function fitCam(){
  const stage = el('stage'), wrap = el('camwrap');
  if (!stage.clientWidth) return;
  const ar = (cam.videoWidth && cam.videoHeight) ? cam.videoWidth / cam.videoHeight : 4/3;
  let w = stage.clientWidth, h = w / ar;
  if (h > stage.clientHeight){ h = stage.clientHeight; w = h * ar; }
  wrap.style.width = w + 'px';
  wrap.style.height = h + 'px';
}

// a copy turned by whole quarter turns clockwise
function turned(src, turns){
  turns = ((turns % 4) + 4) % 4;
  if (!turns) return src;
  const swap = turns % 2 === 1;
  const c = document.createElement('canvas');
  c.width  = swap ? src.height : src.width;
  c.height = swap ? src.width  : src.height;
  const g = c.getContext('2d');
  g.translate(c.width/2, c.height/2);
  g.rotate(turns * Math.PI/2);
  g.drawImage(src, -src.width/2, -src.height/2);
  return c;
}

function step(name){
  for (const k in steps) steps[k].classList.toggle('hide', k !== name);
}
function showErr(msg){ errBox.textContent = msg; errBox.classList.remove('hide'); }

async function openModal(){
  veil.classList.add('on');
  errBox.classList.add('hide');
  el('noCam').classList.add('hide');
  step('camera');

  if (isMobile()){
    el('camLead').textContent = 'Add a photo of your drawing.';
    el('noCamText').textContent =
      'Photograph your drawing, filling the frame and facing right, then upload it.';
    el('noCam').classList.remove('hide');
    el('snap').classList.add('hide');
    el('useFile').classList.add('primary');
    return;
  }
  el('camLead').textContent =
    'Hold your drawing up inside the frame, facing right, then take the photo.';
  el('snap').classList.remove('hide');
  el('useFile').classList.remove('primary');

  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('no camera API');
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    cam.srcObject = stream;
    await cam.play();
    cam.addEventListener('loadedmetadata', fitCam);
    fitCam();
    el('snap').disabled = false;
  } catch (e) {
    el('snap').disabled = true;
    showErr('No camera available, or access was refused. You can upload a photo instead.');
  }
}

function closeModal(){
  veil.classList.remove('on');
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  cam.srcObject = null;
  cancelAnimationFrame(pvRaf); pvRaf = 0;
  shot = null;
}

// Cut out exactly what the white bracket encloses, and mirror it to match
// the mirrored feed on screen.
function grabFrame(){
  const vw = cam.videoWidth, vh = cam.videoHeight;
  const off = (1 - FRAME) / 2;
  const c = document.createElement('canvas');
  c.width = Math.round(vw * FRAME); c.height = Math.round(vh * FRAME);
  const g = c.getContext('2d');
  g.translate(c.width, 0);
  g.scale(-1, 1);
  g.drawImage(cam, vw*off, vh*off, vw*FRAME, vh*FRAME, 0, 0, c.width, c.height);
  return c;
}

async function process(source){
  step('busy');
  await new Promise(r => setTimeout(r, 30));       // let the spinner paint
  let out = null;
  try { out = window.fishify(source); } catch (e) { out = null; }
  if (!out){
    step('camera');
    showErr("Couldn't find a drawing in there. Fill more of the frame and try again.");
    return;
  }
  shot0 = out.canvas;
  shotTurns = 0;
  shot = shot0;
  step('done');        // must be visible before the preview canvas is measured
  startPreview();
}

/* the preview is the same renderer on its own small canvas */
function startPreview(){
  const c = el('preview');

  if (!pv){
    const g = c.getContext('webgl2', {alpha:false, antialias:true, premultipliedAlpha:true});
    pv = { g, ctx: buildCtx(g) };
  }
  const { g } = pv;

  // keep the drawing buffer matched to the box, or the fish comes out
  // stretched and cropped. Re-checked every frame, like the tank.
  const fit = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(c.clientWidth * dpr));
    const h = Math.max(1, Math.round(c.clientHeight * dpr));
    if (c.width === w && c.height === h) return false;
    c.width = w; c.height = h;
    g.viewport(0, 0, w, h);
    pv.vp = makeVP(w/h);
    return true;
  };
  fit();

  if (pv.tex) g.deleteTexture(pv.tex);
  pv.tex = makeTexture(g, shot);

  // size it to sit nicely in the preview rather than to the photo
  const len = 1.15 * Math.tan(FOV/2) * CAM_Z * (c.width/c.height);
  const sp = makeSpecies(pv.tex, len, len * shot.height / shot.width, 0, 0);
  pv.fish = {
    sp, tex: pv.tex, x: 0, y: 0, z: 0, flip: 1, ang: 0,
    // mid-range of what the tank gives its own fish, so the preview swims
    // the same way the aquarium does and follows the same sliders
    heading: 0, roll: 0, phase: 0, amp: 0.15, freq: 3.4, beat: 0, fade: 1,
    skin: 0
  };

  cancelAnimationFrame(pvRaf);
  let last = performance.now()/1000;
  const loop = now => {
    now /= 1000;
    const dt = Math.min(0.05, now - last); last = now;
    const f = pv.fish;
    if (fit()){                 // the modal was resized: refit the fish too
      const L = 1.15 * Math.tan(FOV/2) * CAM_Z * (c.width/c.height);
      f.sp.hw = L/2;
      f.sp.hh = L/2 * shot.height / shot.width;
      f.sp.bodyHalf = f.sp.hw;
    }
    // same tail-beat and turning maths the tank uses, at a typical speed
    const v = 0.8 * cfg.speed;
    f.beat += dt * (2.2 + v * 2.6) * (0.6 + cfg.wave * 0.6);
    f.heading = cfg.turn * Math.sin(now * 0.22);

    g.clearColor(1,1,1,1);
    g.clear(g.COLOR_BUFFER_BIT);
    g.enable(g.BLEND);
    g.blendFunc(g.ONE, g.ONE_MINUS_SRC_ALPHA);
    g.disable(g.DEPTH_TEST);
    g.useProgram(pv.ctx.prog);
    g.bindVertexArray(pv.ctx.mesh.vao);
    g.uniformMatrix4fv(pv.ctx.U.u_vp, false, pv.vp);
    g.uniform1i(pv.ctx.U.u_tex, 0);
    g.activeTexture(g.TEXTURE0);
    drawOne(pv.ctx, f, THEMES.paper.skins[0]);
    pvRaf = requestAnimationFrame(loop);
  };
  pvRaf = requestAnimationFrame(loop);
}

// put the finished fish in the tank, arriving from outside like any other
function release(){
  if (!shot) return;
  const tex = makeTexture(gl, shot);
  const h = CUSTOM_LEN * shot.height / shot.width;
  custom = makeSpecies(tex, CUSTOM_LEN, h, 0, 0);

  // hand the least visible fish over to the new arrival
  let worst = 0;
  for (let i = 1; i < fish.length; i++)
    if ((fish[i].fade ?? 1) < (fish[worst].fade ?? 1)) worst = i;
  if (fish.length) spawn(fish[worst], false);
  closeModal();
}

// the bracket is drawn from the same constant the crop uses
el('guide').style.setProperty('--gi', ((1 - FRAME) / 2 * 100).toFixed(3) + '%');
addEventListener('resize', () => { if (veil.classList.contains('on')) fitCam(); });

el('shoot').addEventListener('click', openModal);
el('x').addEventListener('click', closeModal);
el('close1').addEventListener('click', closeModal);
el('retake').addEventListener('click', openModal);
el('rot').addEventListener('click', () => {
  if (!shot0) return;
  shotTurns = (shotTurns + 1) % 4;
  shot = turned(shot0, shotTurns);
  startPreview();                 // the shape changed, so rebuild the preview
});
el('release').addEventListener('click', release);
el('snap').addEventListener('click', () => { if (cam.videoWidth) process(grabFrame()); });
el('useFile').addEventListener('click', () => el('file').click());
el('file').addEventListener('change', e => {
  const f = e.target.files?.[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => process(img);
  img.onerror = () => showErr("That file couldn't be read as an image.");
  img.src = URL.createObjectURL(f);
  e.target.value = '';
});
veil.addEventListener('click', e => { if (e.target === veil) closeModal(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && veil.classList.contains('on')) closeModal(); });

const fail = msg => {
  document.body.innerHTML =
    '<p style="font:14px/1.6 ui-sans-serif,sans-serif;padding:2rem;color:#444">' + msg + '</p>';
};

(async () => {
  try {
    resize();
    await loadSpecies();
    if (!species.length) return fail('No fish in assets/fish — run tools/extract_fish.py first.');
    requestAnimationFrame(frame);
  } catch (e) {
    fail(e.message);
  }
})();
})();
</script>
</body>
</html>
