<!-- The card behind sky/assets/og-sky.png: the link preview a chat window
     shows. Screenshot it at exactly 1200x630 and save it over that file.

       python3 -m http.server 8123
       # then open http://localhost:8123/tools/og/sky.html at 1200x630

     than taken from the page, so the card doesn't depend on catching the
     right frame. The dashes thin out to the left the way the real ones do. -->
